<!-- SPDX-License-Identifier: GPL-3.0-only
     Copyright (C) 2026 Vasily Kazantsev
     The debug build's page (specs/debug.md): written into install.html at its DEBUG mark by
     fw/tools/make_installer.py, with figures.js, autotest.js and its font, Iosevka Aile (fw/tools/webfont.py). It
     makes the page its own, in the FM-1 screen's look: a sidebar with every button (the install's moved into
     it), a header with the live figures and their graph, three columns that scroll on their own (the stages,
     the autotests' scenarios, the reports), a footer with what is under way. install.html stays as it is. -->
<style>
/*FONTS*/
body.dbg {
  --k: #000000; --blue: #4C5CD0; --green: #4AAA4A; --cyan: #3AA8A8; --red: #C84C44; --magenta: #B054B0;
  --brown: #C87C34; --lgrey: #B4B4AC; --dgrey: #5C5C5C; --lblue: #7C8CF8; --lgreen: #84E884; --lcyan: #84E8E8;
  --lred: #F87C74; --lmagenta: #E884E8; --yellow: #F0E074; --white: #F4F4EC;
  --blue-d: #161B3E; --green-d: #163316; --cyan-d: #113232; --red-d: #3C1614; --yellow-d: #484322;
  --line: #2E2E2E;
  /* Iosevka Aile everywhere, in the page (fw/tools/webfont.py), 400 and 700 (the names say the sizes: 16, 12, 24
     px); never the FM-1's own bitmaps */
  --f16: "PTFM Iosevka Aile", "Iosevka Aile", ui-sans-serif, system-ui, sans-serif;
  --f12: var(--f16);
  --f24: var(--f16);
  --fmono: var(--f16);
  /* (install.html's own names, for what it still draws) */
  --bg: #000; --panel: #000; --panel2: #000; --text: var(--white); --muted: var(--lgrey); --faint: var(--dgrey);
  --mint: var(--green); --amber: var(--yellow); --mono: var(--fmono); --sans: var(--f16);
  color-scheme: dark;
  margin: 0; background: #000; color: var(--lgrey); font: 16px/20px var(--f16);
  font-variant-numeric: tabular-nums;
}
body.dbg > .wrap { display: none; }
body.dbg *, body.dbg *::before, body.dbg *::after { box-sizing: border-box; }
body.dbg ::selection { background: var(--blue); color: var(--white); }
body.dbg * { scrollbar-width: thin; scrollbar-color: var(--dgrey) #000; }

/* ---- the frame: the sidebar left, then the header, the body, the footer ---- */
.dbg .app { display: grid; grid-template-columns: 264px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100vh; }
.dbg .side { grid-row: 1 / 4; border-right: 1px solid var(--dgrey); overflow-y: auto; padding: 8px 12px 10px;
  display: flex; flex-direction: column; gap: 10px; }
.dbg .top { grid-column: 2; border-bottom: 1px solid var(--dgrey); display: block; margin: 0; min-width: 0; }
.dbg .body { grid-column: 2; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr);
  min-height: 0; position: relative; }
.dbg .foot { grid-column: 2; border-top: 1px solid var(--dgrey); padding: 4px 12px 5px; display: flex;
  flex-wrap: nowrap; align-items: center; gap: 4px 18px; min-height: 30px; margin: 0; color: var(--lgrey);
  font: 16px/20px var(--f16); min-width: 0; }

/* the sidebar */
.dbg .brand { display: grid; gap: 2px; }
.dbg .brand .logo { font: 24px/28px var(--f24); color: var(--white); }
.dbg .brand .logo span { color: var(--magenta); }
/* the logo's letters in the start screen's colours (scr_status.c draw_ptfm) */
.dbg .brand .logo b { font-weight: normal; }
.dbg .brand .logo .c-p { color: var(--lred); }
.dbg .brand .logo .c-t { color: var(--lcyan); }
.dbg .brand .logo .c-s { color: var(--yellow); }
.dbg .brand .logo .c-f { color: var(--lgreen); }
.dbg .brand .logo .c-m { color: var(--lmagenta); }
.dbg .brand .who { font: 12px/15px var(--f12); color: var(--lgrey); }
.dbg .brand .who b { color: var(--white); font-weight: normal; }
.dbg .grp { display: grid; gap: 6px; }
.dbg .grp > h3 { margin: 0 0 2px; padding-bottom: 3px; border-bottom: 1px solid var(--dgrey); font: 16px/20px var(--f16);
  color: var(--cyan); }
.dbg .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.dbg .hint { margin: 0; font: 12px/15px var(--f12); color: var(--lgrey); }
.dbg .recs { margin: 0; font: 12px/15px var(--f12); color: var(--lgrey); white-space: pre-wrap; overflow-wrap: anywhere; }
.dbg .warn { margin: 0; font: 12px/15px var(--f12); color: var(--yellow); }

/* keys: a button is a key, its name yellow as the help draws keys; on (CONNECTED, RECORDING) green; a stop red */
.dbg button, .dbg a.small { font: 16px/20px var(--f16); color: var(--yellow); background: #000; border: 1px solid var(--dgrey);
  border-radius: 0; padding: 5px 8px; cursor: pointer; text-align: center; letter-spacing: 0; text-decoration: none;
  min-height: 0; transition: none; transform: none; filter: none; }
.dbg button:hover:not(:disabled), .dbg a.small:hover { border-color: var(--lgrey); }
.dbg button:active:not(:disabled) { background: var(--yellow-d); }
.dbg button:focus-visible, .dbg input:focus-visible, .dbg a.small:focus-visible { outline: 1px solid var(--white); outline-offset: 1px; }
.dbg button:disabled { color: var(--dgrey); border-color: var(--line); cursor: default; opacity: 1; }
.dbg button.on { color: var(--lgreen); border-color: var(--green); }
.dbg button.mini { font: 12px/15px var(--f12); padding: 2px 6px; }   /* (AUTOTEST's DEFAULT, ALL OFF: ticks only) */
.dbg button.stop:not(:disabled) { color: var(--lred); }
.dbg button.ask:not(:disabled) { color: #000; background: var(--yellow); border-color: var(--yellow); animation: dbg-ask 1s steps(1) infinite; }
@keyframes dbg-ask { 50% { background: var(--yellow-d); color: var(--yellow); } }
.dbg button small { display: block; font: 12px/15px var(--f12); color: var(--lgrey); opacity: 1; letter-spacing: 0; }
.dbg button:disabled small { color: var(--dgrey); }
.dbg button.small { font-size: 16px; font-weight: normal; }
/* install.html's: INSTALL and UPLOAD as keys of the sidebar; CLEAR USER DATA the page's own, as they are */
.dbg #go, .dbg #disk, .dbg #upload, .dbg #d-clear { width: 100%; display: block; padding: 6px 8px; font: 16px/20px var(--f16); font-weight: normal;
  background: #000; color: var(--yellow); border: 1px solid var(--dgrey); border-radius: 0; letter-spacing: 0; }
.dbg #go:disabled, .dbg #disk:disabled, .dbg #upload:disabled, .dbg #d-clear:disabled { color: var(--dgrey); border-color: var(--line); }
.dbg #go:hover:not(:disabled), .dbg #disk:hover:not(:disabled), .dbg #upload:hover:not(:disabled), .dbg #d-clear:hover:not(:disabled) { border-color: var(--green); filter: none; }   /* (install.html's #go: only brighter) */.dbg #d-clear { margin-top: 6px; }
/* the one pressed: what it is doing on it (the footer's line and bar as well), the bar as its fill */
/* their second line always two lines high, whatever it says (CLEAN INSTALL's words, a long message: the rest in
   the footer and the key's tooltip), so the sidebar never moves */
.dbg #go small, .dbg #disk small, .dbg #upload small, .dbg #d-clear small { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  height: 30px; overflow: hidden; }
.dbg #go .prog, .dbg #disk .prog, .dbg #upload .prog, .dbg #d-clear .prog { display: none; }
.dbg #go.told .prog, .dbg #disk.told .prog, .dbg #upload.told .prog, .dbg #d-clear.told .prog { display: -webkit-box; color: var(--lgrey); }
.dbg #go.told > small:not(.prog), .dbg #disk.told > small:not(.prog), .dbg #upload.told > small:not(.prog), .dbg #d-clear.told > small:not(.prog) { display: none; }
.dbg #go.told .prog.done, .dbg #disk.told .prog.done, .dbg #upload.told .prog.done, .dbg #d-clear.told .prog.done { color: var(--lgreen); }
.dbg #go.told .prog.err, .dbg #disk.told .prog.err, .dbg #upload.told .prog.err, .dbg #d-clear.told .prog.err { color: var(--lred); }
.dbg #go.busy:disabled, .dbg #disk.busy:disabled, .dbg #upload.busy:disabled, .dbg #d-clear.busy:disabled { color: var(--white); border-color: var(--green);
  background: linear-gradient(90deg, var(--green-d) calc(var(--p, 0) * 1%), #000 0); }
.dbg #go.busy:disabled .prog, .dbg #disk.busy:disabled .prog, .dbg #upload.busy:disabled .prog, .dbg #d-clear.busy:disabled .prog { color: var(--white); }
/* CLEAR USER DATA counting down: asking, as AUTOTEST's CONTINUE does (a press calls it off) */
.dbg #d-clear.ask:not(:disabled) { color: #000; background: var(--yellow); border-color: var(--yellow); animation: dbg-ask 1s steps(1) infinite; }
.dbg #d-clear.ask.told .prog { color: inherit; }
.dbg .switch { margin: 2px 0 0; gap: 8px; align-items: flex-start; font: 12px/15px var(--f12); color: var(--lgrey); }
.dbg .switch b { font: 16px/20px var(--f16); font-weight: normal; letter-spacing: 0; color: var(--white); display: block; }
.dbg .switch input:checked ~ span b { color: var(--lred); }
.dbg .switch .track { width: 32px; height: 16px; border-radius: 0; background: #000; border: 1px solid var(--dgrey); margin-top: 2px; }
.dbg .switch .track::after { top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 0; background: var(--dgrey); }
.dbg .switch input:checked + .track { background: var(--red-d); border-color: var(--red); }
.dbg .switch input:checked + .track::after { transform: translateX(16px); background: var(--lred); }
.dbg .facts { display: flex; flex-wrap: wrap; gap: 2px 8px; margin: 0; }
.dbg .facts .chip, .dbg .brand .chip { border: 0; padding: 0; border-radius: 0; font: 12px/15px var(--f12); color: var(--lgrey); }
.dbg .facts .chip b { color: var(--white); font-weight: normal; }
.dbg .facts .chip.ok { color: var(--lgreen); }
.dbg .facts .chip.bad { color: var(--lred); }
.dbg .facts .chip.warn { color: var(--yellow); }

/* inputs */
.dbg input[type=text] { font: 16px/20px var(--f16); color: var(--white); background: #000; border: 1px solid var(--dgrey);
  border-radius: 0; padding: 4px 6px; width: 100%; min-width: 0; }
.dbg input[type=text]::placeholder { color: var(--dgrey); }
.dbg input[type=text]:disabled { color: var(--lgreen); border-color: var(--green); opacity: 1; }
.dbg input[type=range] { width: 100%; accent-color: var(--cyan); margin: 0; }
.dbg input[type=checkbox]:not(#clean) { appearance: none; -webkit-appearance: none; width: 12px; height: 12px; margin: 0 6px 0 0;
  border: 1px solid var(--lgrey); background: #000; vertical-align: -1px; cursor: pointer; flex: none; }
.dbg input[type=checkbox]:not(#clean):checked { background: var(--cyan); box-shadow: inset 0 0 0 2px #000; }
.dbg input[type=checkbox]:not(#clean):disabled { border-color: var(--dgrey); cursor: default; }
.dbg input[type=checkbox]:not(#clean):disabled:checked { background: var(--dgrey); }
.dbg label { cursor: pointer; }
.dbg .tog { display: flex; align-items: center; color: var(--white); }
.dbg .tog:has(input:disabled) { color: var(--lgrey); cursor: default; }     /* (LISTEN held by a run) */
.dbg #l-on:disabled:checked { background: var(--cyan); }
.dbg #l-save { display: block; }                    /* (LISTEN's recording, saved as a file) */
.dbg #l-delay { white-space: pre-line; }            /* (USB audio's delay: a line a part) */
.dbg .ctl .tog { font: 12px/15px var(--f12); color: var(--lgrey); }   /* (AUTOTEST's RECORD AUDIO) */
.dbg .ctl .tog:has(input:checked) { color: var(--white); }
.dbg .vol { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; font: 12px/15px var(--f12); color: var(--cyan); }

/* the header: the screen's own header line, then the figures and the graph */
.dbg .hbar { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 3px 12px 2px; border-bottom: 1px solid var(--dgrey); }
.dbg .hbar .scr { color: var(--magenta); }
.dbg .hbar .sub { color: var(--white); margin: 0; }
.dbg .hbar .tip { font: 12px/15px var(--f12); color: var(--lgrey); }
.dbg .hbar #d-help { margin-left: auto; }
.dbg button.mini { font: 12px/15px var(--f12); padding: 1px 6px; align-self: center; }
.dbg .figrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 8px 12px 8px; align-items: stretch; }
.dbg .big4 { display: grid; grid-template-columns: repeat(3, minmax(104px, auto)); gap: 4px 16px; align-content: center; }
.dbg .num span { display: block; font: 12px/15px var(--f12); color: var(--cyan); }
.dbg .num b { display: block; font: 700 24px/28px var(--fmono); color: var(--white); white-space: nowrap; }
.dbg .num.warn b { color: var(--yellow); }
.dbg .num.bad b { color: var(--lred); }
.dbg .graph { position: relative; min-width: 0; }
.dbg #f-graph { width: 100%; height: 118px; display: block; background: #000; border: 1px solid var(--dgrey); image-rendering: pixelated; }
.dbg .graph .legend { position: absolute; top: 3px; left: 6px; font: 12px/15px var(--f12); color: var(--dgrey); pointer-events: none; }

/* the body's columns */
.dbg .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-left: 1px solid var(--dgrey); }
.dbg .col:first-child { border-left: 0; }
.dbg .col > h3 { margin: 0; padding: 3px 12px 2px; border-bottom: 1px solid var(--dgrey); font: 16px/20px var(--f16);
  color: var(--cyan); display: flex; gap: 10px; align-items: baseline; }
.dbg .col > h3 span { margin-left: auto; color: var(--lgrey); }
.dbg .scroll { flex: 1; min-height: 0; overflow: auto; position: relative; padding: 4px 0 8px; }

/* the stages */
.dbg table { width: 100%; border-collapse: collapse; font: 16px/18px var(--fmono); }
.dbg th { font: 12px/15px var(--f12); color: var(--cyan); font-weight: normal; text-align: right; padding: 2px 8px 4px; white-space: nowrap; }
.dbg td { text-align: right; padding: 0 8px; white-space: nowrap; color: var(--white); }
.dbg td:first-child, .dbg th:first-child { text-align: left; }
.dbg td:first-child { color: var(--lgrey); }
.dbg tr.inside td:first-child { padding-left: 24px; color: var(--dgrey); }
.dbg tr.inside td { color: var(--lgrey); }
.dbg td.bar { width: 30%; padding-right: 4px; }
.dbg td.bar i { display: block; height: 8px; background: var(--green); min-width: 1px; }
.dbg td.bar i.warn { background: var(--yellow); }
.dbg td.bar i.bad { background: var(--lred); }

/* the scenarios: a group's line, its scenarios; the one running on the playing row's band */
.dbg .tree { display: grid; }
.dbg .tree .gh { display: flex; align-items: center; padding: 4px 12px 2px; color: var(--cyan); }
.dbg .tree .it { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; padding: 1px 12px 2px 30px; }
.dbg .tree .it label { display: flex; align-items: center; color: var(--dgrey); min-width: 0; }
.dbg .tree .it label:has(input:checked) { color: var(--white); }
.dbg .tree .it:has(input:checked) .what { color: var(--lgrey); }
.dbg .tree .it .what { grid-column: 1 / 3; padding-left: 18px; font: 12px/15px var(--f12); color: var(--dgrey); }
.dbg .tree .it .why { grid-column: 1 / 3; padding-left: 18px; font: 12px/15px var(--f12); color: var(--lred); }
.dbg .tree .it .why:empty { display: none; }
.dbg .tree .it .res { font: 16px/20px var(--f16); }
.dbg .tree .it[data-st="PASSED"] .res { color: var(--lgreen); }
.dbg .tree .it[data-st="FAILED"] .res { color: var(--lred); }
.dbg .tree .it[data-st="SKIPPED"] .res, .dbg .tree .it[data-st="STOPPED"] .res { color: var(--dgrey); }
.dbg .tree .it.now { background: var(--blue-d); box-shadow: inset 2px 0 0 var(--lblue); }
.dbg .tree .it.now .res { color: var(--lblue); }
.dbg .tree .it.now .what { color: var(--lgrey); }
/* its keys above the list: RUN, STOP, the warning (CONTINUE is the prompt's, when one waits) */
.dbg .col .ctl { display: grid; gap: 4px; padding: 6px 12px; border-bottom: 1px solid var(--dgrey); }
.dbg .prompt { margin: 8px 12px 4px; padding: 6px 8px; border: 1px solid var(--yellow); color: var(--yellow); display: grid; gap: 6px; }
.dbg .prompt b { font-weight: normal; color: var(--white); }

/* the reports */
.dbg .col h4 { margin: 6px 12px 2px; font: 12px/15px var(--f12); color: var(--cyan); font-weight: normal; }
.dbg .runs { display: grid; }
.dbg .run { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 3px 12px;
  border-bottom: 1px solid var(--line); background: none; border-radius: 0; }
.dbg .run .t { min-width: 0; }
.dbg .run .t b { color: var(--white); font-weight: normal; margin-right: 8px; }
.dbg .run .t small { display: block; font: 12px/15px var(--f12); color: var(--lgrey); }
.dbg .run .acts { display: flex; gap: 4px; }
.dbg .run .acts button { padding: 1px 6px; font: 12px/15px var(--f12); }
.dbg .run .pass { color: var(--lgreen); font-style: normal; }
.dbg .run .fail { color: var(--lred); font-style: normal; }
.dbg .run.rec { background: var(--red-d); }
.dbg .none { padding: 3px 12px; font: 12px/15px var(--f12); color: var(--dgrey); }

/* the footer: what is under way, then the states */
/* one line, whatever is said: what does not fit is cut, whole in its tooltip (the page never jumps) */
.dbg .foot .status { margin: 0; min-height: 0; color: var(--white); font: 16px/20px var(--f16); flex: 1 1 0; min-width: 0; }
.dbg .foot .status.err { color: var(--lred); }
.dbg .foot .status.done { color: var(--lgreen); }
.dbg .foot .status:empty, .dbg .foot .status[data-idle] { display: none; }
.dbg .foot #a-now { color: var(--lblue); flex: 1 1 0; min-width: 0; }
.dbg .foot #a-now:empty { display: none; }
.dbg .foot .status, .dbg .foot #a-now { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 10em; }
.dbg .foot progress { flex: 0 0 160px; width: 160px; height: 8px; margin: 0; border-radius: 0; background: var(--dgrey); }
.dbg .foot progress::-webkit-progress-bar { background: #1B1B1B; border-radius: 0; }
.dbg .foot progress::-webkit-progress-value { background: var(--green); border-radius: 0; }
.dbg .states { display: flex; gap: 4px 16px; flex-wrap: nowrap; margin-left: auto; flex: none; }
.dbg .states .chip { border: 0; padding: 0; border-radius: 0; font: 12px/15px var(--f12); color: var(--lgrey); white-space: nowrap;
  display: inline-block; max-width: 24ch; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
@media (min-width: 1600px) { .dbg .states .chip { max-width: 44ch; } }
.dbg .states .chip::before { content: attr(data-k) " "; color: var(--cyan); }
.dbg .states .chip.ok { color: var(--lgreen); }
.dbg .states .chip.warn { color: var(--yellow); }
.dbg .states .chip.bad { color: var(--lred); }

/* a box over the body: HELP */
.dbg .over { position: absolute; inset: 10px; z-index: 5; overflow: auto; background: #000;
  border: 1px solid var(--lgrey); border-radius: 0; padding: 10px 14px; margin: 0; }
.dbg .over h2 { margin: 0 0 8px; font: 16px/20px var(--f16); color: var(--cyan); letter-spacing: 0; text-transform: none; }
.dbg .planact { margin-top: 10px; gap: 8px; }
.dbg .over h2 ~ h2 { margin-top: 14px; }              /* (install.html's how-to: its parts) */
.dbg .over details { border-top: 1px solid var(--dgrey); padding: 8px 0; }
.dbg .over details:first-of-type { border-top: 0; }
.dbg .over summary { color: var(--white); font-weight: normal; }
.dbg .over details p, .dbg .over details li { color: var(--lgrey); }
.dbg .over b { color: var(--white); font-weight: normal; }
.dbg .over kbd, .dbg .over code { font: 16px var(--f16); color: var(--yellow); border: 0; padding: 0; }
.dbg .over .hint code { font: inherit; }
.dbg .over pre.notes { font: 12px/15px var(--f12); background: #000; border: 1px solid var(--line); border-radius: 0; color: var(--lgrey); }
.dbg .over footer { margin: 8px 0 0; font: 12px/15px var(--f12); color: var(--dgrey); }
.dbg .over .close { float: right; }

/* narrower: two columns, the reports under the scenarios; a phone: one after another, the page scrolls */
@media (max-width: 1240px) {
  .dbg .body { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  .dbg #c-stages { grid-row: 1 / 3; }
  .dbg #c-reports { border-top: 1px solid var(--dgrey); }
}
@media (max-width: 820px), (max-height: 560px) {
  .dbg .app { display: block; height: auto; }
  .dbg .side { border-right: 0; border-bottom: 1px solid var(--dgrey); }
  .dbg .body { display: block; }
  .dbg .col { border-left: 0; border-top: 1px solid var(--dgrey); }
  .dbg .scroll { max-height: 70vh; }
  .dbg .figrow { grid-template-columns: 1fr; }
  .dbg .over { position: fixed; }
  .dbg .foot, .dbg .states { flex-wrap: wrap; }       /* (a phone: everything one after another, so may the footer) */
  .dbg .states { flex: 0 1 auto; min-width: 0; }      /* (and the states within the screen's width) */
  .dbg .foot .status, .dbg .foot #a-now { white-space: normal; flex-basis: 100%; }
}
</style>
<template id="dbg-tpl">
<div class="app" id="app">
  <aside class="side" aria-label="the buttons">
    <div class="brand">
      <div class="logo"><b class="c-p">P</b><b class="c-t">T</b><b class="c-s">/</b><b class="c-f">F</b><b class="c-m">M</b> <span>DEBUG</span></div>
      <div class="who" id="d-who"></div>
      <div class="facts" id="d-facts"></div>
    </div>
    <section class="grp" id="d-firmware">
      <h3>FIRMWARE</h3>
      <button id="d-clear">CLEAR USER DATA<small>everything the FM-1 holds erased, PT/FM kept</small></button>
    </section>
    <section class="grp">
      <h3>FM-1</h3>
      <div class="two">
        <button id="f-conn">CONNECT</button>
        <button id="f-freeze" disabled>FREEZE</button>
      </div>
    </section>
    <section class="grp" id="d-listen">

<script>
(function () {

  function footSync() {

  footSync();
  const help = [...document.querySelectorAll(".wrap > section.card")].find((c) => c.querySelector("details"));
  if (help) [...help.children].forEach((n) => $("d-over").appendChild(n));
  move("foot", $("d-over"));
  move("d-fonts-credit", $("d-over"));
  const who = [$("ident"), $("ver")].filter(Boolean).map((n) => n.textContent).filter(Boolean);
  $("d-who").innerHTML = who.length ? `<b>${who.join(" · ")}</b>` : "";
  const go = $("go");
  if (go && go.firstChild) go.firstChild.textContent = "INSTALL DEBUG FIRMWARE";
  /* INSTALL, UPLOAD and CLEAR USER DATA tell on themselves what they do: the one pressed shows install.html's line
     (#status) under its name, while it works its name becomes what it does with the bar's share, the bar its fill;
     the line stays until another is pressed or CLEAN INSTALL switched (install.html's script untouched: it is
     watched; CLEAR USER DATA writes the same line and bar) */
  const clr = { key: $("d-clear"), left: 0, timer: 0, held: false, running: false };   /* (CLEAR USER DATA: counting down; an autotest running; erasing) */
  const keys = [[go, "INSTALLING"], [$("disk"), "UPLOADING"], [$("upload"), "UPLOADING"], [clr.key, "CLEARING"]].filter(([b]) => b && b.firstChild);
  let told = null, before = null;                     /* before: the line as it was at the press (not this key's yet) */
  keys.forEach(([b, doing]) => {
    b.dataset.name = b.firstChild.textContent;
    b.dataset.doing = doing;
    const p = document.createElement("small");
    p.className = "prog";
    b.appendChild(p);
    b.addEventListener("click", () => {                 /* (a disabled one takes no click) */
      if (b !== clr.key) clearOff();                    /* (another key pressed while CLEAR counts down: called off) */
      told = b;

      tell();
    }, true);

  const clean = $("clean");
  if (clean) clean.addEventListener("change", () => { clearOff(); told = null; tell(); });

    const bar = $("bar"), st = $("status"), busy = !!window.PTFM_busy;
    if (st && before !== null && st.textContent !== before) before = null;
    const cut = busy || clr.held || !navigator.requestMIDIAccess;   /* (CLEAR: not while another key works, nor an autotest) */
    if (clr.key && clr.key.disabled !== cut) clr.key.disabled = cut;
    keys.forEach(([b]) => {
      const on = b === told, works = on && busy, p = b.querySelector(".prog");
      const share = bar && !bar.hidden && bar.hasAttribute("value") ? Math.round(+bar.value) : -1;
      const name = works ? b.dataset.doing + (share >= 0 ? ` ${share}%` : "…") : b.dataset.armed || b.dataset.name;
      if (b.firstChild.textContent !== name) b.firstChild.textContent = name;
      b.classList.toggle("told", on);
      b.classList.toggle("busy", works);
      b.style.setProperty("--p", works && share >= 0 ? String(share) : "0");
      const text = on && st && before === null ? st.textContent : "", kind = on && st ? (st.classList.contains("err") ? "err" : st.classList.contains("done") ? "done" : "") : "";
      if (p.textContent !== text) p.textContent = text;
      p.className = "prog" + (kind ? " " + kind : "");
      const tip = on ? text : b.querySelector("small:not(.prog)") ? b.querySelector("small:not(.prog)").textContent : "";
      if (b.title !== tip) b.title = tip;               /* (the whole line, when two do not hold it) */
    });
  }
  /* a success said (install.html's line with "done": "Done: ...") goes after 10 s: the footer's line and the bar
     away, the key's line back to what it does; an error stays */
  let doneT = 0, doneText = "";
  function doneLater() {
    const st = $("status");
    if (!st || !st.classList.contains("done") || window.PTFM_busy || !st.textContent) {
      clearTimeout(doneT);
      doneT = 0;
      doneText = "";
      return;
    }
    if (doneT && doneText === st.textContent) return;
    clearTimeout(doneT);
    doneText = st.textContent;
    doneT = setTimeout(() => {
      doneT = 0;
      if (st.textContent !== doneText || !st.classList.contains("done")) return;

      st.className = "status";

  if ($("bar")) watch.observe($("bar"), { attributes: true, attributeFilter: ["value", "hidden"] });

  tell();                                               /* (as they are at first: the keys' tooltips) */

  /* CLEAR USER DATA (specs/debug.md, FIRMWARE): CLEAN INSTALL's erasing without the install, through seed.js
     (session.clear: every block of the user area written empty). A press counts down 3 s on the key, a press in
     them calls it off; then it asks the FM-1 for its layout and erases, the progress on the key, the footer's line
     and bar as INSTALL's and UPLOAD's. Figures wait meanwhile (PTFM_busy). */
  const say = (text, kind) => { const st = $("status"); if (st) { st.textContent = text; st.className = "status" + (kind ? " " + kind : ""); } };
  function clearArmed() {
    if (clr.left) clr.key.dataset.armed = `CLEARING IN ${clr.left}`; else delete clr.key.dataset.armed;
    clr.key.classList.toggle("ask", !!clr.left);
  }
  function clearOff() {                                 /* the countdown called off (another key's words follow) */
    if (!clr.left) return;
    clearInterval(clr.timer);
    clr.left = 0;
    clearArmed();
    say("CLEAR USER DATA called off: nothing was erased.");
    tell();
  }
  if (clr.key) clr.key.addEventListener("click", () => {
    if (clr.left) { clearOff(); return; }
    clr.left = 3;
    const line = () => say(`All user data erased in ${clr.left} s: press again to call it off.`);
    clearArmed(); line();
    clr.timer = setInterval(() => {
      if (--clr.left > 0) { clearArmed(); line(); return; }
      clearInterval(clr.timer);
      clearArmed();
      clearRun();
    }, 1000);
  });
  async function clearRun() {
    const others = ["go", "disk", "upload", "clean"].map($).filter(Boolean), was = others.map((n) => n.disabled);
    const bar = $("bar");
    window.PTFM_busy = clr.running = true;
    others.forEach((n) => { n.disabled = true; });
    if (bar) bar.hidden = true;
    say("Asking the FM-1 what it holds…");
    let s = null;
    try {
      let midi;
      try { midi = await navigator.requestMIDIAccess({ sysex: true }); }
      catch (e) { say("MIDI was not allowed. Allow it for this page and press CLEAR USER DATA again.", "err"); return; }
      const fin = pick(midi.inputs), fout = pick(midi.outputs);
      if (!fin || !fout) { say("No FM-1 found. Is it connected by USB and switched on? Close what else uses its MIDI port, then try again.", "err"); return; }
      await fin.open(); await fout.open();
      s = PTFM_seed.session(PTFM_seed.midiTransport(fin, fout), { log: (t) => console.log(t) });
      try {
        const r = await s.clear((p) => {
          if (bar) { bar.hidden = false; bar.value = (p.done / p.total) * 100; }
          say(`Erasing the FM-1: block ${p.done} of ${p.total}. Keep the FM-1 connected.`);
        });
        if (bar) bar.value = 100;
        if (r.bad) say(`Erased, but the FM-1 still counts ${r.bad} damaged record${r.bad === 1 ? "" : "s"}: press CLEAR USER DATA again.`, "err");
        else say("Done: the FM-1's user area is empty, PT/FM kept.", "done");
      } catch (e) {
        const code = e && e.code;
        if (e && e.before) say(code === PTFM_seed.RESULT.UNSAVED ? "Edits not saved on the FM-1: REVERT or SAVE them first. Nothing was erased."
          : code !== undefined ? `The FM-1 refused: ${e.message}. Nothing was erased.`
          : `The FM-1 did not answer as PT/FM (${e && e.message}). Is PT/FM running? Nothing was erased.`, "err");
        else {
          say(`Erasing stopped: ${e && e.message}. Part of the user area may be erased already: press CLEAR USER DATA again.`, "err");
          try { await s.abort(); } catch (_) { /* the FM-1 mounts by itself after 10 s */ }
        }

    }
  }
  window.addEventListener("beforeunload", (e) => { if (clr.running) { e.preventDefault(); e.returnValue = ""; } });
  {                                                     /* HELP: the key beside install.html's keys */
    const dl = $("d-over").querySelector("dl.keys");
    if (dl) {
      const dt = document.createElement("dt"), dd = document.createElement("dd");
      dt.textContent = "CLEAR USER DATA";
      dd.textContent = "Needs PT/FM running. Erases everything the FM-1 holds (your work, the settings, damaged records " +
        "too), as CLEAN INSTALL does, without installing: an empty user area, PT/FM kept. A press counts down 3 s on " +
        "the key; a press in them calls it off. If the FM-1 has edits not saved, it refuses: REVERT them (or SAVE) on " +

  $("d-help").addEventListener("click", () => { $("d-over").hidden = !$("d-over").hidden; });
  $("d-close").addEventListener("click", () => { $("d-over").hidden = true; });
  const esc = (s) => String(s).replace(/[<&"]/g, (c) => (c === "<" ? "&lt;" : c === "&" ? "&amp;" : "&quot;"));
  const mmss = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  const S = FG.session();
  let input = null, output = null, timer = null, sentAt = 0, waiting = false, flags = 0, answered = false;
  let recs = null, armed = null;                       /* (RESTARTS: the last RECORDS; a test counting down) */
  let lastFig = null, lastFigC2 = null;                 /* (the last 31: its 37 comes right after it; the last with one) */
  const figRecent = [];                                 /* (the last 60 windows, each with its arrival time) */
  let proveC2 = null;                                   /* (PROVE 4-6 sent: {name, n}: the next 37s say how it went) */
  const live = [];
  const state = (t, cls) => { $("f-state").textContent = t; $("f-state").className = "chip" + (cls ? " " + cls : ""); };
  /* timers that keep their time with the page out of sight: a browser slows a hidden or covered page's own timers
     to about one a second (later one a minute), which made an autotest's 60 ms tap a 1 s hold and stretched what it
     measured; a worker's timers are not slowed, and its message wakes the page. Without a worker: the page's own */
  const WT = (() => {

        "  else { clearTimeout(t.get(id)); t.delete(id); } };\n"));

  const asks = [];                                       /* 40 STATE? waiting for their 41 */
  let stNum = 0, stLost = 0, stLate = 0;                 /* the last answer's number; answers never got, came late */
  let atWin = null, atBench = null, atStop = false, atPrompt = null, atRun = null, atList = [];
  let figAt = 0;                                         /* (Date.now at the FM-1's last FIGURES answer) */
  let atStarting = false, atAudio = null;               /* (RUN waiting for the input; RECORD AUDIO's scenarios) */

  /* the run's clock (io.now: the scenarios' times, the counters, the times kept for estimates): Date.now with the

  let atPaused = 0, atPauseAt = 0;

        const s = R.audio && R.audio.scen.get(`${r.group}: ${r.name}`);
        k++;
        if (s && s.bytes) files.push({ name: `${String(k).padStart(2, "0")}-${slug(`${r.group} ${r.name}`)}.wav`, blob: wavBlob(s.blocks, R.audio.rate) });
      }
      return files;
    });
  }

  /* ---- the live figures and the runs' list ---- */
  const level = (box, pctv) => { $(box).className = "num" + (pctv >= 80 ? " bad" : pctv >= 50 ? " warn" : ""); };
  function render() {
    const f = S.last;
    $("f-copy").disabled = !S.all.length;
    $("f-reset").disabled = !S.sections.length || S.recording;
    if (f && f.halves) {
      const cpu = f.isrSum / (f.halves * f.halfUs) * 100, worst = f.isrMax / f.halfUs * 100;
      $("f-cpu").textContent = cpu.toFixed(1) + "%"; level("f-cpu-box", cpu);
      $("f-worst").textContent = f.isrMax + " µs"; level("f-worst-box", worst);
      $("f-voices").textContent = f.voices + " / " + f.voicesMost;
      $("f-freeze").textContent = f.frozenNow ? "UNFREEZE" : "FREEZE";
      /* core 2 (its 37): its share now, its state (STOPPED red, why on the label, the fault record in the tooltip); the
         window before's until this one's 37 comes, right after its 31 */
      const fc = f.c2 ? f : lastFigC2, c2 = fc ? fc.c2 : null, cpu2 = c2 ? c2.sum / (fc.halves * fc.halfUs) * 100 : 0;
      $("f-cpu2").textContent = c2 ? cpu2.toFixed(1) + "%" : "–"; level("f-cpu2-box", cpu2);
      $("f-c2").textContent = c2 ? FG.C2_STATE[c2.state] || "?" : "–";
      $("f-c2-k").textContent = c2 && c2.state === 3 && c2.why ? `CORE 2: ${FG.C2_WHY[c2.why] || c2.why}` :
        c2 && c2.state === 2 && c2.forced ? "CORE 2: BY 38" : "CORE 2";
      $("f-c2-box").className = "num" + (c2 && c2.state === 3 ? " bad" : c2 && c2.state !== 1 ? " warn" : "");
      $("f-c2-box").title = !c2 ? "" : `${FG.c2Text(c2)}; blocks handed over ${c2.blocks}; core 1 waited ${c2.waitSum} µs ` +
        `(the longest ${c2.waitMax}); late halves: core 1's ${c2.late1}, core 2's ${c2.late2}; misreads ${c2.misreads}` +
        (c2.stackSize ? `; its stack ${c2.stackUsed} of ${c2.stackSize} B` : "") +
        (c2.faultVec || c2.faultPc ? `; its fault: vector ${c2.faultVec}, pc ${hex8(c2.faultPc)}` : "");
      const rows = [];
      const budget = f.halves * f.halfUs;
      let topSum = 0;
      const barCls = (p) => (p >= 30 ? "bad" : p >= 15 ? "warn" : "");
      f.stages.forEach((st) => {
        const inside = !!FG.INSIDE[st.name];
        if (!inside) topSum += st.sum;
        if (inside && !st.sum) return;
        const share = st.sum / budget * 100;
        rows.push(`<tr class="${inside ? "inside" : ""}"><td>${st.name}</td><td>${(st.sum / f.halves).toFixed(0)}</td>` +
          `<td>${share.toFixed(1)}%</td><td class="bar"><i class="${barCls(share)}" style="width:${Math.min(100, share).toFixed(1)}%"></i></td><td>${st.max}</td></tr>`);
      });
      const other = f.isrSum + (f.c2 ? f.c2.sum : 0) - topSum;   /* (the stages hold both cores' work) */
      rows.push(`<tr><td>(interrupt)</td><td>${(other / f.halves).toFixed(0)}</td><td>${(other / budget * 100).toFixed(1)}%</td>` +
        `<td class="bar"><i style="width:${Math.max(0, Math.min(100, other / budget * 100)).toFixed(1)}%"></i></td><td></td></tr>`);
      $("f-stages").innerHTML = rows.join("");
    } else if (!$("f-stages").innerHTML) {
      $("f-stages").innerHTML = `<tr><td colspan="5" class="none">CONNECT, with the debug build on the FM-1</td></tr>`;
    }
    const cur = S.recording ? S.sections.length - 1 : -1, st = cur >= 0 ? FG.stats(S.of(cur)) : null;
    $("f-late").textContent = st ? String(st.late) : "–";
    $("f-late-box").className = "num" + (st && st.late ? " bad" : "");
    $("f-runs").innerHTML = S.sections.map((sec, i) => {
      const s = FG.stats(S.of(i)), rec = i === cur, A = runAudio.get(sec);
      const audio = !A ? "" : A.refused ? ", no audio (the input not allowed)" : `, audio ${mmss(A.bytes / 4 / (A.rate || 48000))} ${mb(A.bytes)}`;
      return `<div class="run${rec ? " rec" : ""}"><span class="t"><b>${esc(sec.name)}</b>${rec ? "RECORDING" : ""}<small>` +
        (s ? `${mmss(s.seconds)}, CPU 1 mean ${s.cpu.mean.toFixed(1)}%, worst ${s.cpu.worst.toFixed(1)}%, ` +
             (s.cpu2 ? `CPU 2 mean ${s.cpu2.mean.toFixed(1)}%, worst ${s.cpu2.worst.toFixed(1)}%, ` : "") +
             `<em class="${s.late ? "fail" : ""}">late ${s.late}</em>` : "no figures yet") + audio + "</small></span>" +
        `<span class="acts"><button data-do="copy" data-i="${i}">COPY</button>` +
        `<button data-do="zip" data-i="${i}"${rec ? " disabled" : ""}>ZIP</button>` +
        `<button class="stop" data-do="del" data-i="${i}"${rec ? " disabled" : ""}>DELETE</button></span></div>`;
    }).join("") || `<div class="none">none yet: RECORD in the sidebar</div>`;
    graph();
    delayShow();
  }
  function graph() {                                   /* the last 60 windows: CPU 1 bars, CPU 2 a line, 50 and 80 % lines */
    const c = $("f-graph"), W = c.clientWidth || c.width, H = c.clientHeight || c.height;
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const g = c.getContext("2d"), css = getComputedStyle(document.body), col = (v) => css.getPropertyValue(v).trim();
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
    const top = 18, h0 = H - top - 1, bw = Math.max(2, Math.floor(W / 60));
    for (const [p, v] of [[50, "--yellow"], [80, "--red"]]) {
      g.fillStyle = col(v);
      for (let x = 0; x < W; x += 4) g.fillRect(x, top + h0 - Math.round(h0 * p / 100), 2, 1);
    }
    const x0 = W - live.length * bw;
    live.forEach((f, i) => {
      if (!f.halves) return;
      const cpu = f.isrSum / (f.halves * f.halfUs) * 100, worst = f.isrMax / f.halfUs * 100, x = x0 + i * bw;
      g.fillStyle = col(cpu >= 80 ? "--lred" : cpu >= 50 ? "--yellow" : "--green");
      const h = Math.min(h0, Math.round(h0 * cpu / 100));
      g.fillRect(x + 1, top + h0 - h, bw - 2, h);
      g.fillStyle = col("--white");
      g.fillRect(x + 1, top + h0 - Math.min(h0, Math.round(h0 * worst / 100)), bw - 2, 2);
      if (f.late) { g.fillStyle = col("--lred"); g.fillRect(x + 1, top - 6, bw - 2, 4); }
    });
    g.strokeStyle = col("--lcyan");                     /* CPU 2: a line through each window's middle (broken where a
                                                           window has no 37) */
    g.lineWidth = 2;
    g.beginPath();
    let pen = false;
    live.forEach((f, i) => {
      if (!f.halves || !f.c2) { pen = false; return; }
      const cpu2 = f.c2.sum / (f.halves * f.halfUs) * 100, x = x0 + i * bw + bw / 2;
      const y = top + h0 - Math.min(h0, Math.round(h0 * cpu2 / 100));
      if (pen) g.lineTo(x, y); else g.moveTo(x, y);
      pen = true;
    });
    g.stroke();
  }
  window.addEventListener("resize", graph);
  render(); buttons(); renderRuns();
  /* (from the browser's console, or a test: the runs, the autotests' runs, a message as if it came from the FM-1) */
  window.PTFM_figs = { session: S, autotests: atRuns, feed: (bytes) => onMessage({ data: Uint8Array.from(bytes) }), render };
})();
</script>
